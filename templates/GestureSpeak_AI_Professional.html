// ============================================================================
// COMPUTER VISION & HAND LANDMARK CLASSIFICATION ENGINE
// ============================================================================
function dist3d(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y, (p1.z || 0) - (p2.z || 0));
}

function classifyHandPose(landmarks) {
  if (!landmarks || landmarks.length < 21) {
    return { id: "UNKNOWN", confidence: 0 };
  }

  const lm = landmarks;

  // Extension check: In MediaPipe, Y coordinates increase downwards.
  // Fingertip is extended if tip.y is significantly above pip.y
  const isExtended = (tipIdx, pipIdx, delta = 0.025) => {
    return lm[tipIdx].y < (lm[pipIdx].y - delta);
  };

  const wrist = lm[0];
  const indexMcp = lm[5];
  const thumbTip = lm[4];
  const thumbIp = lm[3];
  const thumbMcp = lm[2];

  // Thumb extension & orientation
  const isRightHand = wrist.x < indexMcp.x;
  const thumbExtended = isRightHand
    ? (thumbTip.x < thumbIp.x - 0.02)
    : (thumbTip.x > thumbIp.x + 0.02);

  const thumbPointingUp = thumbTip.y < (thumbMcp.y - 0.06);
  const thumbPointingDown = thumbTip.y > (thumbMcp.y + 0.06);

  const indexUp = isExtended(8, 6);
  const middleUp = isExtended(12, 10);
  const ringUp = isExtended(16, 14);
  const pinkyUp = isExtended(20, 18);

  const extendedFingersCount = [thumbExtended, indexUp, middleUp, ringUp, pinkyUp].filter(Boolean).length;

  // Inter-finger distances
  const thumbToIndexDist = dist3d(lm[4], lm[8]);
  const thumbToMiddleDist = dist3d(lm[4], lm[12]);
  const indexToMiddleDist = dist3d(lm[8], lm[12]);
  const middleToRingDist = dist3d(lm[12], lm[16]);

  // Check all curled (fist)
  const allCurled = [8, 12, 16, 20].every(idx => lm[idx].y > lm[idx - 2].y + 0.01);

  // 1. EMERGENCY: Closed fist with no fingers extended
  if (allCurled && !thumbPointingUp && !thumbPointingDown) {
    return { id: "EMERGENCY", confidence: 0.88 };
  }

  // 2. YES: Thumbs Up only
  if (thumbPointingUp && !indexUp && !middleUp && !ringUp && !pinkyUp) {
    return { id: "YES", confidence: 0.92 };
  }

  // 3. NO: Thumbs Down only
  if (thumbPointingDown && !indexUp && !middleUp && !ringUp && !pinkyUp) {
    return { id: "NO", confidence: 0.90 };
  }

  // 4. OKAY: Thumb tip and index tip forming circle + middle, ring, pinky extended
  const isOkCircle = thumbToIndexDist < 0.065;
  if (isOkCircle && middleUp && ringUp && pinkyUp && !indexUp) {
    return { id: "OKAY", confidence: 0.89 };
  }

  // 5. STOP: Open palm with all 5 fingers extended and spread
  if (indexUp && middleUp && ringUp && pinkyUp && thumbExtended && extendedFingersCount >= 5) {
    if (indexToMiddleDist > 0.04 && middleToRingDist > 0.04) {
      return { id: "STOP", confidence: 0.91 };
    }
  }

  // 6. HELLO: Open hand raised, palm facing camera (4 or 5 fingers upright)
  if (indexUp && middleUp && ringUp && pinkyUp && !thumbPointingDown) {
    return { id: "HELLO", confidence: 0.86 };
  }

  // 7. WATER: Three middle fingers extended (index, middle, ring) — 'W' shape
  if (indexUp && middleUp && ringUp && !pinkyUp && !thumbPointingUp) {
    return { id: "WATER", confidence: 0.88 };
  }

  // 8. HELP vs 9. THANK_YOU (Index + Middle extended)
  if (indexUp && middleUp && !ringUp && !pinkyUp) {
    if (indexToMiddleDist > 0.045) {
      return { id: "HELP", confidence: 0.89 }; // V-sign spread
    } else {
      return { id: "THANK_YOU", confidence: 0.84 }; // Fingers parallel/touching
    }
  }

  // 10. FOOD: Pinch pose (all fingertips clustered near thumb)
  const isPinch = (thumbToIndexDist < 0.08 && thumbToMiddleDist < 0.09 && !indexUp && !middleUp);
  if (isPinch) {
    return { id: "FOOD", confidence: 0.85 };
  }

  return { id: "UNKNOWN", confidence: 0.3 };
}

// ============================================================================
// TEMPORAL SMOOTHING BUFFER (Debounce & Consistency)
// ============================================================================
class TemporalSmoother {
  constructor(windowSize = 10, consistencyRatio = 0.7) {
    this.windowSize = windowSize;
    this.consistencyRatio = consistencyRatio;
    this.history = [];
    this.lastConfirmedGesture = null;
  }

  push(prediction) {
    this.history.push(prediction);
    if (this.history.length > this.windowSize) {
      this.history.shift();
    }
    return this.evaluate();
  }

  evaluate() {
    if (this.history.length < 5) return null;

    const counts = {};
    const totalConf = {};

    for (const item of this.history) {
      if (!item || item.id === "UNKNOWN") continue;
      counts[item.id] = (counts[item.id] || 0) + 1;
      totalConf[item.id] = (totalConf[item.id] || 0) + item.confidence;
    }

    const sortedEntries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    if (sortedEntries.length === 0) return null;

    const [topId, topCount] = sortedEntries[0];
    const consistency = topCount / this.history.length;

    if (consistency >= this.consistencyRatio) {
      const avgConf = totalConf[topId] / topCount;
      const smoothedConfidence = Math.min(avgConf * (0.9 + consistency * 0.15), 0.99);
      this.lastConfirmedGesture = topId;
      return {
        id: topId,
        confidence: smoothedConfidence,
        isStable: true
      };
    }
    return null;
  }

  reset() {
    this.history = [];
    this.lastConfirmedGesture = null;
  }
}

// ============================================================================
// BROWSER TEXT-TO-SPEECH SERVICE
// ============================================================================
const TTS = {
  isSupported: typeof window !== "undefined" && "speechSynthesis" in window,
  voices: [],

  init() {
    if (!this.isSupported) return;
    this.loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = () => this.loadVoices();
    }
  },

  loadVoices() {
    if (!this.isSupported) return [];
    this.voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
    return this.voices;
  },

  speak(text, settings = {}, onStart, onEnd) {
    if (!this.isSupported || !text) return;
    try {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = settings.rate ?? 1.0;
      utterance.pitch = settings.pitch ?? 1.0;
      utterance.volume = settings.volume ?? 1.0;

      if (settings.voiceURI && this.voices.length > 0) {
        const found = this.voices.find(v => v.voiceURI === settings.voiceURI);
        if (found) utterance.voice = found;
      }

      if (onStart) utterance.onstart = onStart;
      if (onEnd) utterance.onend = onEnd;
      utterance.onerror = () => onEnd && onEnd();

      window.speechSynthesis.speak(utterance);
    } catch (e) {
      console.warn("TTS Error:", e);
      if (onEnd) onEnd();
    }
  },

  stop() {
    if (this.isSupported) window.speechSynthesis.cancel();
  }
};
TTS.init();

function ConfidenceMeter({ confidence, threshold = 0.75 }) {
  const pct = Math.round((confidence || 0) * 100);
  const isHigh = confidence >= threshold;
  const isMed = confidence >= 0.5;
  const barColor = isHigh ? "linear-gradient(90deg, #22d3ee, #10b981)" : isMed ? "#f59e0b" : "#ef4444";
  const textColor = isHigh ? "#10b981" : isMed ? "#f59e0b" : "#ef4444";

  return (
    <div className="w-full">
      <div className="flex justify-between items-center text-xs font-semibold mb-1">
        <span className="text-slate-400">Recognition Confidence</span>
        <span style={{ color: textColor }} className="font-mono text-sm">{pct}%</span>
      </div>
      <div className="w-full h-2.5 bg-slate-900 rounded-full overflow-hidden relative border border-slate-800">
        <div
          className="h-full rounded-full transition-all duration-300"
          style={{ width: `${pct}%`, background: barColor }}
        />
        <div
          className="absolute top-0 bottom-0 w-0.5 bg-cyan-400 shadow-[0_0_8px_#22d3ee]"
          style={{ left: `${threshold * 100}%` }}
          title={`Threshold: ${Math.round(threshold * 100)}%`}
        />
      </div>
      <div className="flex justify-between text-[10px] text-slate-500 mt-1">
        <span>0%</span>
        <span className="text-cyan-400/80">Threshold: {Math.round(threshold * 100)}%</span>
        <span>100%</span>
      </div>
    </div>
  );
}

// ============================================================================
// CAMERA PANEL COMPONENT
// ============================================================================
function CameraPanel({
  onResults,
  cameraActive,
  setCameraActive,
  cameraError,
  setCameraError,
  onEnterDemoMode
}) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const handsRef = useRef(null);
  const [multiHandAlert, setMultiHandAlert] = useState(false);
  const [modelLoading, setModelLoading] = useState(false);
  const [fps, setFps] = useState(0);
  const lastTimeRef = useRef(performance.now());
  const frameCountRef = useRef(0);

  const onMediaPipeResults = useCallback((results) => {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (!video || !canvas) return;

    const ctx = canvas.getContext("2d");
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    frameCountRef.current++;
    const now = performance.now();
    if (now - lastTimeRef.current >= 1000) {
      setFps(Math.round((frameCountRef.current * 1000) / (now - lastTimeRef.current)));
      frameCountRef.current = 0;
      lastTimeRef.current = now;
    }

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      setMultiHandAlert(results.multiHandLandmarks.length > 1);

      for (const landmarks of results.multiHandLandmarks) {
        if (window.drawConnectors && window.HAND_CONNECTIONS) {
          window.drawConnectors(ctx, landmarks, window.HAND_CONNECTIONS, {
            color: "rgba(34, 211, 238, 0.65)",
            lineWidth: 2.5
          });
        }

        for (let i = 0; i < landmarks.length; i++) {
          const pt = landmarks[i];
          const x = pt.x * canvas.width;
          const y = pt.y * canvas.height;

          ctx.beginPath();
          if ([4, 8, 12, 16, 20].includes(i)) {
            ctx.arc(x, y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = "#22d3ee";
            ctx.shadowColor = "#06b6d4";
            ctx.shadowBlur = 10;
          } else {
            ctx.arc(x, y, 3.5, 0, 2 * Math.PI);
            ctx.fillStyle = "#14b8a6";
            ctx.shadowBlur = 0;
          }
          ctx.fill();
        }
      }

      onResults(results.multiHandLandmarks[0], results.multiHandLandmarks.length);
    } else {
      setMultiHandAlert(false);
      onResults(null, 0);
    }
  }, [onResults]);

  const startCamera = async () => {
    setCameraError(null);
    setModelLoading(true);
    try {
      if (!window.Hands) {
        throw new Error("MediaPipe Hands library not loaded. Check internet connectivity.");
      }

      const hands = new window.Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.65
      });

      hands.onResults(onMediaPipeResults);

      try {
        await Promise.race([
          hands.initialize(),
          new Promise((_, reject) => setTimeout(() => reject(new Error("init-timeout")), 4000))
        ]);
      } catch (e) {
        console.log("MediaPipe background warmup will continue on first frame:", e);
      }
      handsRef.current = hands;

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 640 },
          height: { ideal: 480 },
          facingMode: "user"
        }
      });

      let isCancelled = false;
      let isProcessingFrame = false;

      const processLoop = async () => {
        if (isCancelled || !videoRef.current || !handsRef.current) return;
        if (videoRef.current.readyState >= 2 && !isProcessingFrame) {
          isProcessingFrame = true;
          try {
            await handsRef.current.send({ image: videoRef.current });
          } catch (e) {
            // Frame skips are normal
          } finally {
            isProcessingFrame = false;
          }
        }
        if (!isCancelled) {
          requestAnimationFrame(processLoop);
        }
      };

      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        const startPlayback = async () => {
          try {
            await videoRef.current.play();
          } catch (pErr) {
            console.warn("Autoplay promise notice:", pErr);
          }
          setModelLoading(false);
          setCameraActive(true);
          processLoop();
        };

        if (videoRef.current.readyState >= 1) {
          await startPlayback();
        } else {
          videoRef.current.onloadedmetadata = startPlayback;
          setTimeout(() => {
            setModelLoading(false);
            setCameraActive(true);
            processLoop();
          }, 600);
        }
      }

      handsRef.current._cleanup = () => { isCancelled = true; };
    } catch (err) {
      console.error("Camera Init Error:", err);
      setModelLoading(false);
      setCameraActive(false);
      if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
        setCameraError("Camera permission was denied. Please grant webcam access in browser settings.");
      } else if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
        setCameraError("No webcam found on this device. You can test all 10 gestures via Demo Simulation Mode.");
      } else {
        setCameraError(err.message || "Failed to initialize webcam or MediaPipe Hands engine.");
      }
    }
  };

  const stopCamera = () => {
    if (handsRef.current?._cleanup) {
      handsRef.current._cleanup();
    }
    if (videoRef.current?.srcObject) {
      videoRef.current.srcObject.getTracks().forEach(t => t.stop());
      videoRef.current.srcObject = null;
    }
    if (handsRef.current) {
      try { handsRef.current.close(); } catch (e) {}
      handsRef.current = null;
    }
    const canvas = canvasRef.current;
    if (canvas) {
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    setCameraActive(false);
    setMultiHandAlert(false);
    onResults(null, 0);
  };

  useEffect(() => {
    return () => stopCamera();
  }, []);

  return (
    <div className="flex flex-col gap-3">
      <div className="webcam-viewport relative hud-box">
        {!cameraActive && (
          <div className="absolute inset-0 z-10 flex flex-col items-center justify-center p-6 text-center bg-[#050812]/92 backdrop-blur-md">
            <div className="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center mb-4 text-cyan-400 text-3xl shadow-[0_0_20px_rgba(34,211,238,0.2)]">
              📷
            </div>
            <h3 className="font-tech text-lg font-bold text-white mb-2">Webcam Vision Viewport</h3>
            <p className="text-slate-400 text-xs sm:text-sm max-w-sm mb-5">
              Position your hand clearly within the camera frame. The AI extracts 21 skeleton landmarks in real time.
            </p>

            {cameraError && (
              <div className="bg-rose-500/15 border border-rose-500/40 rounded-xl p-3 text-rose-300 text-xs max-w-md mb-4 text-left">
                <strong>Camera Notice:</strong> {cameraError}
              </div>
            )}

            <div className="flex flex-wrap items-center justify-center gap-3">
              <button
                onClick={startCamera}
                disabled={modelLoading}
                className="btn-cyber-primary text-sm px-6 py-3"
              >
                {modelLoading ? (
                  <>
                    <span className="w-4 h-4 border-2 border-slate-900 border-t-transparent rounded-full animate-spin" />
                    Loading MediaPipe Engine...
                  </>
                ) : (
                  <>
                    <span>▶</span> Start Camera
                  </>
                )}
              </button>

              <button
                onClick={onEnterDemoMode}
                className="btn-cyber-secondary text-sm px-5 py-3"
              >
                <span>🎭</span> Demo Mode
              </button>
            </div>
          </div>
        )}

        <video
          ref={videoRef}
          playsInline
          muted
          style={{ transform: "scaleX(-1)" }}
          aria-label="Webcam Video Stream"
        />
        <canvas
          ref={canvasRef}
          style={{ transform: "scaleX(-1)" }}
          className="pointer-events-none"
          aria-hidden="true"
        />

        {/* Live HUD Indicators */}
        {cameraActive && (
          <div className="absolute top-3 left-3 z-20 flex items-center gap-2 bg-slate-900/85 border border-cyan-500/30 px-3 py-1.5 rounded-lg backdrop-blur-md">
            <span className="status-bulb active" />
            <span className="font-tech text-xs font-bold text-cyan-400 tracking-wider">LIVE FEED</span>
            <span className="text-[10px] text-slate-400 font-mono border-l border-slate-700 pl-2">{fps} FPS</span>
          </div>
        )}

        {multiHandAlert && (
          <div className="absolute top-3 right-3 z-20 bg-amber-500/90 text-black px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-lg animate-bounce">
            <span>⚠️</span> Multiple Hands Detected (Please Present 1 Hand)
          </div>
        )}

        {cameraActive && (
          <div className="absolute bottom-3 right-3 z-20">
            <button
              onClick={stopCamera}
              className="px-3.5 py-1.5 bg-slate-900/80 hover:bg-slate-800 text-slate-300 hover:text-white border border-slate-700 rounded-lg text-xs font-semibold backdrop-blur-md transition-all shadow-md"
            >
              ⏹ Stop Camera
            </button>
          </div>
        )}
      </div>

      {/* Camera Information Sub-bar */}
      <div className="p-3 bg-cyan-950/20 border border-cyan-500/20 rounded-xl flex items-start gap-2.5 text-xs text-slate-400">
        <span className="text-cyan-400 text-base leading-none mt-0.5">🔒</span>
        <div>
          <strong className="text-slate-200">Local Client-Side Processing:</strong> Camera video frames are analyzed locally in your browser memory. No video footage is recorded, stored, or streamed to external servers.
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// COMMUNICATION TIMELINE & HISTORY LOG
// ============================================================================
function HistoryPanel({ history, onClearHistory, onReplayMessage }) {
  const exportHistory = () => {
    if (history.length === 0) return;
    const content = history.map(h => `[${new Date(h.timestamp).toLocaleTimeString()}] ${h.message} (${h.gestureName})`).join("\n");
    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `GestureSpeak-History-${new Date().toISOString().slice(0, 10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="cyber-card p-5 space-y-4">
      <div className="flex items-center justify-between pb-3 border-b border-slate-800">
        <div className="flex items-center gap-2">
          <span className="text-base">📜</span>
          <h3 className="font-tech font-bold text-base text-white">Communication Timeline</h3>
          <span className="text-xs text-slate-400 font-mono bg-slate-800 px-2 py-0.5 rounded-full">
            {history.length}
          </span>
        </div>
        <div className="flex items-center gap-2">
          {history.length > 0 && (
            <>
              <button
                onClick={exportHistory}
                className="text-xs text-slate-400 hover:text-cyan-400 px-2.5 py-1 bg-slate-800/60 rounded-md transition-colors"
                title="Export history as text file"
              >
                ⬇ Export
              </button>
              <button
                onClick={onClearHistory}
                className="text-xs text-rose-400 hover:text-rose-300 px-2.5 py-1 bg-rose-500/10 rounded-md transition-colors"
              >
                Clear
              </button>
            </>
          )}
        </div>
      </div>

      {history.length === 0 ? (
        <div className="py-8 text-center text-slate-500 text-xs">
          No translated messages recorded yet. Recognized gestures will appear here chronologically.
        </div>
      ) : (
        <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
          {history.slice().reverse().map((item, idx) => (
            <div
              key={idx}
              className="p-3 bg-slate-900/60 hover:bg-slate-850 rounded-xl border border-slate-800/80 flex items-center justify-between text-xs transition-colors"
            >
              <div className="flex items-center gap-3">
                <span className="font-mono text-slate-500 text-[11px]">
                  {new Date(item.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}
                </span>
                <div>
                  <span className="font-bold text-white text-sm mr-2">"{item.message}"</span>
                  <span className="text-cyan-400 text-[11px] font-mono">[{item.gestureName}]</span>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                {item.isDemo && (
                  <span className="text-[10px] font-mono bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded">
                    DEMO
                  </span>
                )}
                <button
                  onClick={() => onReplayMessage(item.message)}
                  className="p-1 hover:bg-cyan-500/20 text-cyan-400 rounded transition-colors"
                  title="Replay Voice"
                >
                  🔊
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState("translator");
  const [cameraActive, setCameraActive] = useState(false);
  const [cameraError, setCameraError] = useState(null);
  const [isDemoMode, setIsDemoMode] = useState(false);
  const [selectedDemoId, setSelectedDemoId] = useState(null);

  const [handCount, setHandCount] = useState(0);
  const [recognized, setRecognized] = useState(null);
  const [isStable, setIsStable] = useState(false);
  const [autoSpeak, setAutoSpeak] = useState(true);
  const [isSpeaking, setIsSpeaking] = useState(false);
  const [copied, setCopied] = useState(false);
  const [history, setHistory] = useState([]);
  const [accessibilityModalOpen, setAccessibilityModalOpen] = useState(false);

  // Accessibility & Theme States
  const [theme, setTheme] = useState("dark");
  const [fontScale, setFontScale] = useState("md");

  // Speech Settings
  const [speechSettings, setSpeechSettings] = useState({
    rate: 1.0,
    pitch: 1.0,
    volume: 1.0,
    voiceURI: ""
  });

  const smootherRef = useRef(new TemporalSmoother(10, 0.7));
  const lastSpokenGestureRef = useRef(null);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  useEffect(() => {
    const scaleMap = { xs: "14px", sm: "15px", md: "16px", lg: "18px", xl: "20px" };
    document.documentElement.style.fontSize = scaleMap[fontScale] || "16px";
  }, [fontScale]);

  // Real-time camera landmark processing
  const handleCameraResults = useCallback((landmarks, count) => {
    setHandCount(count);

    if (count === 0) {
      smootherRef.current.reset();
      setIsStable(false);
      setRecognized(prev => (prev?.confidence >= 0.75 ? prev : null));
      return;
    }
    if (count > 1) {
      return;
    }

    const raw = classifyHandPose(landmarks);
    const stable = smootherRef.current.push(raw);

    if (stable && stable.id !== "UNKNOWN") {
      const gDef = GESTURES_DATA.find(g => g.id === stable.id);
      const newResult = {
        id: stable.id,
        confidence: stable.confidence,
        timestamp: Date.now()
      };
      setRecognized(newResult);
      setIsStable(true);

      if (stable.confidence >= (gDef?.threshold || 0.75)) {
        if (autoSpeak && lastSpokenGestureRef.current !== stable.id) {
          lastSpokenGestureRef.current = stable.id;
          speakText(gDef?.message || stable.id);
          addHistory(stable.id, gDef?.message || stable.id, false);
        }
      }
    } else if (raw.id !== "UNKNOWN") {
      setRecognized({ id: raw.id, confidence: raw.confidence, timestamp: Date.now() });
      setIsStable(false);
    }
  }, [autoSpeak, speechSettings]);

  // Demo simulation mode
  const handleSelectDemoGesture = (gesture) => {
    setSelectedDemoId(gesture.id);
    setIsDemoMode(true);
    setHandCount(1);
    setIsStable(true);
    setRecognized({
      id: gesture.id,
      confidence: gesture.demoConfidence / 100,
      timestamp: Date.now()
    });

    if (autoSpeak) {
      speakText(gesture.message);
    }
    addHistory(gesture.id, gesture.message, true);
  };

  const speakText = (text) => {
    if (!TTS.isSupported || !text) return;
    setIsSpeaking(true);
    TTS.speak(
      text,
      speechSettings,
      () => setIsSpeaking(true),
      () => setIsSpeaking(false)
    );
  };

  const addHistory = (gestureId, message, isDemo) => {
    const gDef = GESTURES_DATA.find(g => g.id === gestureId);
    setHistory(prev => [
      ...prev,
      {
        gestureId,
        gestureName: gDef?.name || gestureId,
        message,
        timestamp: Date.now(),
        isDemo
      }
    ]);
  };

  const handleManualSpeak = () => {
    const gDef = GESTURES_DATA.find(g => g.id === recognized?.id);
    if (gDef?.message) {
      speakText(gDef.message);
    }
  };

  const handleCopyMessage = async () => {
    const gDef = GESTURES_DATA.find(g => g.id === recognized?.id);
    if (!gDef?.message) return;
    try {
      await navigator.clipboard.writeText(gDef.message);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch {
      const el = document.createElement("textarea");
      el.value = gDef.message;
      document.body.appendChild(el);
      el.select();
      document.execCommand("copy");
      document.body.removeChild(el);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }
  };

  const handleClear = () => {
    setRecognized(null);
    setSelectedDemoId(null);
    setIsStable(false);
    smootherRef.current.reset();
    lastSpokenGestureRef.current = null;
  };

  const handleStartLiveTranslatorCTA = () => {
